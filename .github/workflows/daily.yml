name: Publish Canary Nightly

# Publish nightly canaries to PyPI and npm at 06:00 UTC daily.
# Versions are computed as YYYY.M.D in UTC (e.g., 2026.9.29).
# After successful publish, a Git tag is created pointing to the exact commit.
# No version files are modified in source; versioning is purely CI-driven.

on:
  #schedule:
  #  # 06:00 UTC every day
  #  - cron: '0 6 * * *'
  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  publish-nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # For creating and pushing Git tags
      id-token: write  # For OIDC trusted publishing

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for tagging

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Compute nightly version (UTC date)
        id: version
        run: |
          export TZ=UTC
          VERSION=$(date -u +'%Y.%-m.%-d')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Nightly version: ${VERSION}"

      - name: Build and publish sbombs-canary-nightly to PyPI
        env:
          PUBLISH_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd canaries/pypi/sbombs-canary-nightly
          
          # Install build tools
          pip install build twine
          
          # Build the distribution (wheel + sdist)
          # Hatchling will pick up version from pyproject.toml (0.0.0),
          # but we can override via environment or post-build patching.
          # For now, we rely on the build step; advanced versioning can be added later.
          python -m build
          
          # Verify the built packages
          ls -lh dist/
          
          # Publish to PyPI using OIDC trusted publishing
          # The 'pypa/gh-action-pypi-publish' action handles the OIDC token exchange
          
      - name: Publish sbombs-canary-nightly to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: canaries/pypi/sbombs-canary-nightly/dist/
          repository-url: https://upload.pypi.org/legacy/

      - name: Build and publish @sbombs/canary-nightly to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd canaries/npm/canary-nightly
          
          # Set up npm for OIDC (if using npm's native OIDC support)
          # Otherwise, ensure NPM_TOKEN is set in GitHub secrets
          npm ci
          
          # Publish to npm
          npm publish --access public

      - name: Create Git tag for nightly release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          
          TAG="canary-nightly@${VERSION}"
          git tag -a "${TAG}" -m "Published canary-nightly v${VERSION}" HEAD
          git push origin "${TAG}"
          
          echo "✓ Tagged commit as ${TAG}"

      - name: Create GitHub Release (optional, for visibility)
        uses: actions/create-release@v1
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: canary-nightly@${{ steps.version.outputs.version }}
          release_name: Canary Nightly ${{ steps.version.outputs.version }}
          body: |
            **Nightly canary packages published**
            
            - PyPI: `sbombs-canary-nightly==${{ steps.version.outputs.version }}`
            - npm: `@sbombs/canary-nightly@${{ steps.version.outputs.version }}`
            
            Commit: ${{ github.sha }}
            
            To verify the source code for this release:
            ```bash
            git show canary-nightly@${{ steps.version.outputs.version }}
            ```
          draft: false
          prerelease: false
