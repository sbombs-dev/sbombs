name: Publish PyPI wdeps (Manual)

# Publish the sbombs-wdeps package to PyPI (manual trigger as needed).
# Version is stored in pyproject.toml and should be incremented before publishing.
# After successful publish, a Git tag is created pointing to the exact commit.
#
# NOTE: npm packages are NOT published by this workflow due to MFA requirements.
# npm packages must be published manually.

on:
  # Manual trigger only
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: 'Type "yes" to confirm publishing sbombs-wdeps'
        required: true

permissions:
  contents: write  # For creating and pushing Git tags
  id-token: write  # For OIDC trusted publishing to PyPI

jobs:
  verify-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version not already published
        run: |
          # Check if tag already exists for this version
          VERSION=$(grep 'version = ' canaries/pypi/sbombs-wdeps/pyproject.toml | head -1 | sed 's/version = "\([^"]*\)".*/\1/')
          if git rev-parse "pypi-wdeps@${VERSION}" 2>/dev/null; then
            echo "❌ ERROR: Version ${VERSION} has already been published!"
            echo "Please increment the version in pyproject.toml before publishing."
            exit 1
          fi
          echo "✓ Version check passed (not yet published): ${VERSION}"

      - name: Verify confirmation
        run: |
          if [[ "${{ github.event.inputs.confirm_publish }}" != "yes" ]]; then
            echo "❌ Confirmation not given. Aborting."
            exit 1
          fi
          echo "✓ Confirmation verified"

  publish-wdeps:
    needs: verify-safety
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Extract version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep 'version = ' canaries/pypi/sbombs-wdeps/pyproject.toml | head -1 | sed 's/version = "\([^"]*\)".*/\1/')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "PyPI version: ${VERSION}"

      - name: Build sbombs-wdeps for PyPI
        run: |
          cd canaries/pypi/sbombs-wdeps
          
          pip install build
          python -m build
          ls -lh dist/

      - name: Publish sbombs-wdeps to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: canaries/pypi/sbombs-wdeps/dist/
          repository-url: https://upload.pypi.org/legacy/

      - name: Create Git tag for wdeps release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          
          TAG="pypi-wdeps@${VERSION}"
          
          # Tag should not exist (verified in earlier job), but check anyway
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "❌ ERROR: Tag ${TAG} already exists! This should not happen."
            exit 1
          fi
          
          git tag -a "${TAG}" -m "Published sbombs-wdeps v${VERSION} to PyPI" HEAD
          git push origin "${TAG}"
          
          echo "✓ Tagged commit as ${TAG}"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="pypi-wdeps@${VERSION}"
          
          # Create release
          gh release create "${TAG}" \
            --title "PyPI wdeps ${VERSION}" \
            --notes "**PyPI wdeps package published**

          This package contains dependencies for testing dependency-related policies.
          
          - PyPI: \`sbombs-wdeps==${VERSION}\`
          
          Commit: ${{ github.sha }}
          
          **Note:** npm packages are not published automatically due to MFA requirements. 
          Publish npm packages manually if needed.
          
          To verify the source code for this release:
          \`\`\`bash
          git show ${TAG}
          \`\`\`"
