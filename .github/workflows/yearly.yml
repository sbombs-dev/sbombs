name: Publish Canary Anchor (Manual, One-Time)

# Publish the canary-anchor control package (one-time, never again).
# This is a MANUAL trigger only; the anchor should never be republished.
# Versions for anchor are stored in package.json / pyproject.toml (not computed).
# After successful publish, a Git tag is created pointing to the exact commit.

on:
  # Manual trigger only; no schedule or auto-triggers
  workflow_dispatch:
    inputs:
      confirm_anchor:
        description: 'Type "yes" to confirm publishing canary-anchor (this is one-time only)'
        required: true

permissions:
  contents: write  # For creating and pushing Git tags
  id-token: write  # For OIDC trusted publishing

jobs:
  verify-anchor-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify anchor has not been published before
        run: |
          # Check if canary-anchor tag already exists
          if git rev-parse canary-anchor@* 2>/dev/null; then
            echo "❌ ERROR: Anchor has already been published! Tags starting with 'canary-anchor@' found."
            exit 1
          fi
          echo "✓ Anchor tag check passed (not yet published)"

      - name: Verify confirmation
        run: |
          if [[ "${{ github.event.inputs.confirm_anchor }}" != "yes" ]]; then
            echo "❌ Confirmation not given. Aborting."
            exit 1
          fi
          echo "✓ Confirmation verified"

  publish-anchor:
    needs: verify-anchor-safety
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Extract anchor version from package.json
        id: npm_version
        run: |
          VERSION=$(cat canaries/npm/canary-anchor/package.json | grep '"version"' | head -1 | sed 's/.*"version": "\([^"]*\)".*/\1/')
          echo "npm_version=${VERSION}" >> $GITHUB_OUTPUT
          echo "npm version: ${VERSION}"

      - name: Extract anchor version from pyproject.toml
        id: py_version
        run: |
          VERSION=$(grep 'version = ' canaries/pypi/sbombs-canary-anchor/pyproject.toml | head -1 | sed 's/version = "\([^"]*\)".*/\1/')
          echo "py_version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Python version: ${VERSION}"

      - name: Verify versions match
        run: |
          NPM_V="${{ steps.npm_version.outputs.npm_version }}"
          PY_V="${{ steps.py_version.outputs.py_version }}"
          
          if [[ "${NPM_V}" != "${PY_V}" ]]; then
            echo "❌ Version mismatch! npm: ${NPM_V}, PyPI: ${PY_V}"
            exit 1
          fi
          echo "✓ Versions match: ${NPM_V}"

      - name: Build and publish sbombs-canary-anchor to PyPI
        run: |
          cd canaries/pypi/sbombs-canary-anchor
          
          pip install build twine
          python -m build
          ls -lh dist/

      - name: Publish sbombs-canary-anchor to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: canaries/pypi/sbombs-canary-anchor/dist/
          repository-url: https://upload.pypi.org/legacy/

      - name: Build and publish @sbombs/canary-anchor to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd canaries/npm/canary-anchor
          npm ci
          npm publish --access public

      - name: Create immutable Git tag for anchor
        env:
          VERSION: ${{ steps.npm_version.outputs.npm_version }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          
          TAG="canary-anchor@${VERSION}"
          git tag -a "${TAG}" -m "Published canary-anchor v${VERSION} (one-time, control package)" HEAD
          git push origin "${TAG}"
          
          echo "✓ Tagged commit as ${TAG}"

      - name: Create GitHub Release (immutable record)
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: canary-anchor@${{ steps.npm_version.outputs.npm_version }}
          release_name: Canary Anchor ${{ steps.npm_version.outputs.npm_version }} (Control, One-Time)
          body: |
            **⚠️ CONTROL CANARY (One-Time Release, Never to be Republished)**
            
            This is the anchor control package. It must never be republished or modified.
            
            - PyPI: `sbombs-canary-anchor==${{ steps.npm_version.outputs.npm_version }}`
            - npm: `@sbombs/canary-anchor@${{ steps.npm_version.outputs.npm_version }}`
            
            Commit: ${{ github.sha }}
            
            To verify the source code for this release:
            ```bash
            git show canary-anchor@${{ steps.npm_version.outputs.npm_version }}
            ```
          draft: false
          prerelease: false
