[project]
name = "sbombs-yearly"
version = "2026.1.0"
description = "SBOMBS yearly control test fixture, published once per year. Do not depend on this package."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbombs_yearly"]
