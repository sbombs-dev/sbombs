[project]
name = "sbombs"
version = "0.0.0"
description = "SBOM Behavior Observation, Manifest & Blocking Suite - supply chain policy test runner"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbombs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
