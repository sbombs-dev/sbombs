name: Publish Yearly (Manual, Once-Per-Year)

# Publish the yearly control package (once per year, never republish).
# This is a MANUAL trigger only; the yearly package should not be republished within a year.
# Versions for yearly are stored in package.json / pyproject.toml (semantic: YYYY.M.0).
# After successful publish, a Git tag is created pointing to the exact commit.

on:
  # Manual trigger only; no schedule or auto-triggers
  workflow_dispatch:
    inputs:
      confirm_yearly:
        description: 'Type "yes" to confirm publishing sbombs-yearly (this is once-per-year only)'
        required: true

permissions:
  contents: write  # For creating and pushing Git tags
  id-token: write  # For OIDC trusted publishing

jobs:
  verify-yearly-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify yearly version not already published
        run: |
          # Check if yearly tag already exists for this version
          YEARLY_VERSION=$(cat canaries/npm/yearly/package.json | grep '"version"' | head -1 | sed 's/.*"version": "\([^"]*\)".*/\1/')
          if git rev-parse "yearly@${YEARLY_VERSION}" 2>/dev/null; then
            echo "❌ ERROR: Yearly version ${YEARLY_VERSION} has already been published!"
            exit 1
          fi
          echo "✓ Yearly version check passed (not yet published)"

      - name: Verify confirmation
        run: |
          if [[ "${{ github.event.inputs.confirm_yearly }}" != "yes" ]]; then
            echo "❌ Confirmation not given. Aborting."
            exit 1
          fi
          echo "✓ Confirmation verified"

  publish-yearly:
    needs: verify-yearly-safety
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract yearly version from package.json
        id: npm_version
        run: |
          VERSION=$(cat canaries/npm/yearly/package.json | grep '"version"' | head -1 | sed 's/.*"version": "\([^"]*\)".*/\1/')
          echo "npm_version=${VERSION}" >> $GITHUB_OUTPUT
          echo "npm version: ${VERSION}"

      - name: Extract yearly version from pyproject.toml
        id: py_version
        run: |
          VERSION=$(grep 'version = ' canaries/pypi/sbombs-yearly/pyproject.toml | head -1 | sed 's/version = "\([^"]*\)".*/\1/')
          echo "py_version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Python version: ${VERSION}"

      - name: Verify versions match
        run: |
          NPM_V="${{ steps.npm_version.outputs.npm_version }}"
          PY_V="${{ steps.py_version.outputs.py_version }}"
          
          if [[ "${NPM_V}" != "${PY_V}" ]]; then
            echo "❌ Version mismatch! npm: ${NPM_V}, PyPI: ${PY_V}"
            exit 1
          fi
          echo "✓ Versions match: ${NPM_V}"

      - name: Build and publish sbombs-yearly to PyPI
        run: |
          cd canaries/pypi/sbombs-yearly
          
          pip install build twine
          python -m build
          ls -lh dist/

      - name: Publish sbombs-yearly to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: canaries/pypi/sbombs-yearly/dist/
          repository-url: https://upload.pypi.org/legacy/

      - name: Publish @sbombs/yearly to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd canaries/npm/yearly
          npm publish --access public --provenance

      - name: Create immutable Git tag for yearly
        env:
          VERSION: ${{ steps.npm_version.outputs.npm_version }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          
          TAG="yearly@${VERSION}"
          git tag -a "${TAG}" -m "Published yearly v${VERSION} (yearly control package)" HEAD
          git push origin "${TAG}"
          
          echo "✓ Tagged commit as ${TAG}"

      - name: Create GitHub Release (immutable record)
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: yearly@${{ steps.npm_version.outputs.npm_version }}
          release_name: Yearly ${{ steps.npm_version.outputs.npm_version }} (Annual Control)
          body: |
            **⚠️ YEARLY CONTROL PACKAGE (Annual Release, Do Not Republish Within Year)**
            
            This is the yearly control package. It must not be republished until the next year.
            
            - PyPI: `sbombs-yearly==${{ steps.npm_version.outputs.npm_version }}`
            - npm: `@sbombs/yearly@${{ steps.npm_version.outputs.npm_version }}`
            
            Commit: ${{ github.sha }}
            
            To verify the source code for this release:
            ```bash
            git show yearly@${{ steps.npm_version.outputs.npm_version }}
            ```
          draft: false
          prerelease: false
