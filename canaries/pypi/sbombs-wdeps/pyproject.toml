[project]
name = "sbombs-wdeps"
version = "1.0.0"
description = "SBOMBS test fixture with runtime dependencies. Do not depend on this package."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "sbombs-daily>=2026.10.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbombs_wdeps"]
